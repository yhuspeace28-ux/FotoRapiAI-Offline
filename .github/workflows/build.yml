name: Build FotoRapiAI Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e

          test -f FotoRapiAI-Offline-clean.zip

          rm -rf /tmp/fotorapi
          mkdir -p /tmp/fotorapi

          unzip -q FotoRapiAI-Offline-clean.zip -d /tmp/fotorapi

          if [ -f /tmp/fotorapi/settings.gradle.kts ]; then
            cp -a /tmp/fotorapi/. .
          else
            PROJECT_DIR=$(find /tmp/fotorapi -name settings.gradle.kts -type f -print -quit | xargs dirname)
            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Download MI-GAN model
        run: |
          set -e

          mkdir -p app/src/main/assets

          curl -L --fail --retry 3 --retry-all-errors \
            "https://huggingface.co/litert-community/MI-GAN-512-Places2-LiteRT/resolve/main/migan_fp16.tflite?download=true" \
            -o app/src/main/assets/migan_fp16.tflite

          test -s app/src/main/assets/migan_fp16.tflite

          ls -lh app/src/main/assets/migan_fp16.tflite

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoRapiAI-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
