name: Build FotoRapiAI Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v2 project
        run: |
          set -e

          test -f FotoRapiAI-Offline-v2.zip

          rm -rf /tmp/fotorapi-v2
          mkdir -p /tmp/fotorapi-v2

          unzip -q FotoRapiAI-Offline-v2.zip -d /tmp/fotorapi-v2

          if [ -f /tmp/fotorapi-v2/settings.gradle.kts ]; then
            cp -a /tmp/fotorapi-v2/. .
          else
            PROJECT_DIR=$(find /tmp/fotorapi-v2 \
              -name settings.gradle.kts \
              -type f \
              -print -quit | xargs dirname)

            test -n "$PROJECT_DIR"

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "v2 project extracted successfully."

      - name: Fix Kotlin source
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # -----------------------------------------
          # Fix MaskView.kt
          # -----------------------------------------

          mask = Path(
              "app/src/main/java/com/fotorapi/offline/MaskView.kt"
          )

          s = mask.read_text()

          s = s.replace(
              "out[i] = if ((pixels[i].toInt() and 0xFF) > 20) 0 else 255",
              "out[i] = if ((pixels[i].toInt() and 0xFF) > 20) 0.toByte() else 255.toByte()"
          )

          mask.write_text(s)

          # -----------------------------------------
          # Fix MiganInpainter.kt
          # -----------------------------------------

          migan = Path(
              "app/src/main/java/com/fotorapi/offline/MiganInpainter.kt"
          )

          s = migan.read_text()

          s = s.replace("erase.first", "erase[0]")
          s = s.replace("erase.second", "erase[1]")
          s = s.replace("erase.third", "erase[2]")
          s = s.replace("erase.fourth", "erase[3]")

          # -----------------------------------------
          # MI-GAN output:
          # [1, 3, 512, 512]
          # channel 0 = R
          # channel 1 = G
          # channel 2 = B
          # -----------------------------------------

          s = s.replace(
              "val r = ((output[plane + i] + 1f)",
              "val r = ((output[i] + 1f)"
          )

          s = s.replace(
              "val g = ((output[2 * plane + i] + 1f)",
              "val g = ((output[plane + i] + 1f)"
          )

          s = s.replace(
              "val b = ((output[3 * plane + i] + 1f)",
              "val b = ((output[2 * plane + i] + 1f)"
          )

          migan.write_text(s)
          PY

          echo "Kotlin fixes applied."

      - name: Download MI-GAN model
        run: |
          set -e

          mkdir -p app/src/main/assets

          curl -L \
            --fail \
            --retry 3 \
            --retry-all-errors \
            "https://huggingface.co/litert-community/MI-GAN-512-Places2-LiteRT/resolve/main/migan_fp16.tflite?download=true" \
            -o app/src/main/assets/migan_fp16.tflite

          test -s app/src/main/assets/migan_fp16.tflite

          ls -lh app/src/main/assets/migan_fp16.tflite

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoRapiAI-Offline-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
